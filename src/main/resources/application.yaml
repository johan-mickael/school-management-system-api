# src/main/resources/application.yml
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:school}
    username: ${POSTGRES_USER:school}
    password: ${POSTGRES_PASSWORD:school}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
      ttl-seconds: ${JWT_TTL_SECONDS:3600}
    seed-admin:
      enabled: ${SEED_ADMIN_ENABLED:false}
      username: ${SEED_ADMIN_USERNAME:admin}
      password: ${SEED_ADMIN_PASSWORD:}
