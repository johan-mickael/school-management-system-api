# compose.yaml
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: maven:3.9-eclipse-temurin-25
    working_dir: /workspace
    command: mvn spring-boot:run
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/workspace
      - maven-repo:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DB_HOST: ${DB_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS}
      SEED_ADMIN_ENABLED: ${SEED_ADMIN_ENABLED}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      EXAM_INTEGRITY_THRESHOLD: ${EXAM_INTEGRITY_THRESHOLD}
      REPORTING_ATTENDANCE_RISK_THRESHOLD: ${REPORTING_ATTENDANCE_RISK_THRESHOLD}
      REPORTING_GRADE_RISK_THRESHOLD: ${REPORTING_GRADE_RISK_THRESHOLD}
      TESTCONTAINERS_DOCKER_NETWORK: schoolnet

networks:
  default:
    name: schoolnet

volumes:
  db-data:
  maven-repo: