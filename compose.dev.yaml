# compose.dev.yaml
# Dev-only overlay. Adds Adminer for browsing/editing db data.
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up
services:
  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_HOST_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
