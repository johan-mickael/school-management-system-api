<div class="flex min-h-screen items-center justify-center bg-canvas px-4">
  <form class="panel panel-pad w-full max-w-sm" (ngSubmit)="submit()">
    <div class="mb-6 flex items-center gap-2">
      <span class="h-[18px] w-[18px] flex-none rounded-sm bg-base"></span>
      <div>
        <h1 class="text-[15px] font-semibold text-text">School Management</h1>
        <p class="text-xs text-text-2">Sign in to continue</p>
      </div>
    </div>

    @if (error()) {
      <app-feedback [message]="error()!" />
    }

    <label class="field-label" for="username">Username</label>
    <input
      id="username"
      name="username"
      class="input mb-4"
      [ngModel]="username()"
      (ngModelChange)="username.set($event)"
      autocomplete="username"
      required
    />

    <label class="field-label" for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      class="input mb-6"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      autocomplete="current-password"
      required
    />

    <button type="submit" class="btn w-full justify-center" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
