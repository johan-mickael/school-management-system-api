<div class="relative flex min-h-screen items-center justify-center bg-canvas px-4">
  <button
    class="absolute top-4 right-4 rounded-md p-2 text-text-2 hover:bg-hover hover:text-text"
    (click)="theme.toggle()"
    [attr.aria-pressed]="theme.isDark()"
    aria-label="Toggle color theme"
  >
    @if (theme.isDark()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-[18px] w-[18px]" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-[18px] w-[18px]" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
      </svg>
    }
  </button>

  <form class="panel panel-pad w-full max-w-sm" (ngSubmit)="submit()">
    <div class="mb-6 flex items-center gap-2">
      <span class="h-[18px] w-[18px] flex-none rounded-sm bg-base"></span>
      <div>
        <h1 class="text-[15px] font-semibold text-text">School Management</h1>
        <p class="text-xs text-text-2">Sign in to continue</p>
      </div>
    </div>

    @if (error()) {
      <app-feedback [message]="error()!" />
    }

    <label class="field-label" for="username">Username</label>
    <input
      id="username"
      name="username"
      class="input mb-4"
      [ngModel]="username()"
      (ngModelChange)="username.set($event)"
      autocomplete="username"
      required
    />

    <label class="field-label" for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      class="input mb-6"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      autocomplete="current-password"
      required
    />

    <button type="submit" class="btn w-full justify-center" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
