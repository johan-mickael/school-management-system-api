<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-6">
        <span class="font-semibold text-slate-900">School Management System</span>
        <nav class="flex gap-4">
          @for (link of links(); track link.path) {
            <a
              [routerLink]="link.path"
              routerLinkActive="text-slate-900 font-medium"
              class="text-sm text-slate-500 hover:text-slate-900"
            >
              {{ link.label }}
            </a>
          }
        </nav>
      </div>
      <div class="flex items-center gap-3 text-sm text-slate-500">
        <span>{{ claims()?.username }} · {{ claims()?.role }}</span>
        <button class="rounded border border-slate-300 px-3 py-1 hover:bg-slate-100" (click)="logout()">
          Sign out
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-8">
    <router-outlet />
  </main>
</div>
