name: build-and-test

on:
  pull_request:
    branches:
      - integration
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: school
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school -d school"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvn verify
        run: mvn -B verify
        env:
          POSTGRES_DB: school
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
