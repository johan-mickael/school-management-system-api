name: build-and-test

on:
  pull_request:
    branches:
      - integration
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvn verify
        run: mvn -B verify
